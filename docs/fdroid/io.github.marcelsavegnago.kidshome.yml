# Draft fdroiddata recipe for KidsHome. Do not submit this file upstream
# until `fdroid lint`, `fdroid build`, and `fdroid scanner` have been run.
# This repository does not submit anything to F-Droid.
#
# commit is the squash merge of the F-Droid prep onto master
# (14267f684d75b49c03d560461881e0eac4213a4b). Tag v1.5.1 predates the
# unsigned-release fix, the Gradle 8.9 wrapper jar, and the favicon change.
# Do not point commit at that tag.
#
# Leave Binaries unset until a GitHub release is built from
# 14267f684d75b49c03d560461881e0eac4213a4b. The existing v1.5.1 APK will
# not match this tree.
#
# Build needs JDK 17 and compileSdk 35. assembleRelease is unsigned unless
# keystore.properties exists or -PciSignRelease=true is passed. F-Droid
# must not pass that property. vcsInfo and dependenciesInfo are disabled
# so the APK does not embed the local git checkout. There is no product
# flavor; `gradle: yes` runs assembleRelease from the repository root
# (settings.gradle is there, so subdir must stay unset).
#
# Reviewer notes:
# - No Google Play Services, Firebase, analytics, or proprietary SDK.
#   Dependencies are AndroidX, Material (Apache-2.0), NanoHTTPD (Apache-2.0),
#   and ZXing core (Apache-2.0). org.json:json is testImplementation only
#   (JSON license) and is not in the APK; the app uses the platform org.json.
# - Favicons are loaded from the same host as the parent-configured site.
#   Default site tiles (Poki, PBS Kids, Coolmath) are optional bookmarks.
# - Accessibility service hijacks Home on Amazon Fire, where the default
#   launcher cannot be replaced, and can optionally bounce non-allowed apps.
#   It is not used to read screen content for tracking.
# - Device Admin / Device Owner is an optional kiosk the parent provisions
#   once with `dpm set-device-owner`. It is not required to use the app.
# - keystore/debug.keystore is a published CI test key. Release builds ignore
#   it unless -PciSignRelease=true. F-Droid should sign with its own key.
# - AppIcon/RawLogo.psd is design source and is not packaged in the APK.
# - Official Gradle wrapper 8.9:
#   SHA-256 498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17
#   Distribution gradle-8.9-bin.zip:
#   SHA-256 d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab

